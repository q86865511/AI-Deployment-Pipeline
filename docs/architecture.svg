<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" role="img" aria-labelledby="t d" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <title id="t">AI-Deployment-Pipeline 系統架構</title>
  <desc id="d">React 前端經 FastAPI 驅動模型轉換(PT→ONNX→TensorRT)、推論與基準測試，部署到 Triton Inference Server，並以 Prometheus + Grafana 監控 GPU。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7c8aa5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="640" rx="14" fill="#0f1623"/>
  <rect x="0" y="0" width="920" height="640" rx="14" fill="none" stroke="#283449" stroke-width="1.5"/>
  <text x="40" y="50" fill="#5eb8a8" font-size="25" font-weight="600">AI-Deployment-Pipeline · 系統架構</text>
  <text x="40" y="77" fill="#8a96ab" font-size="15">YOLO 模型 自動轉換 → Triton 部署 → 基準測試 + GPU 監控</text>

  <text x="40" y="128" fill="#5d6b82" font-size="12" letter-spacing="1">前端</text>
  <text x="40" y="218" fill="#5d6b82" font-size="12" letter-spacing="1">API</text>
  <text x="40" y="312" fill="#5d6b82" font-size="12" letter-spacing="1">服務</text>
  <text x="40" y="420" fill="#5d6b82" font-size="12" letter-spacing="1">推論</text>
  <text x="40" y="528" fill="#5d6b82" font-size="12" letter-spacing="1">監控</text>

  <!-- Frontend -->
  <rect x="250" y="98" width="420" height="56" rx="8" fill="#16243a" stroke="#3a5a8c" stroke-width="1.5"/>
  <text x="460" y="122" fill="#dbe4f0" font-size="16" font-weight="500" text-anchor="middle">React 前端（Ant Design + ECharts）</text>
  <text x="460" y="142" fill="#8a96ab" font-size="12.5" text-anchor="middle">模型上傳 · 任務設定 · 結果圖表</text>

  <!-- API -->
  <rect x="250" y="188" width="420" height="52" rx="8" fill="#16243a" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="460" y="220" fill="#dbe4f0" font-size="16" font-weight="500" text-anchor="middle">FastAPI · /api（models · conversion · inference · benchmark）</text>

  <!-- Services -->
  <rect x="70" y="282" width="250" height="58" rx="8" fill="#10261f" stroke="#2f7d63" stroke-width="1.5"/>
  <text x="195" y="307" fill="#dbe4f0" font-size="14.5" font-weight="500" text-anchor="middle">轉換服務</text>
  <text x="195" y="326" fill="#8a96ab" font-size="12" text-anchor="middle">PT → ONNX → TensorRT</text>

  <rect x="335" y="282" width="250" height="58" rx="8" fill="#10261f" stroke="#2f7d63" stroke-width="1.5"/>
  <text x="460" y="307" fill="#dbe4f0" font-size="14.5" font-weight="500" text-anchor="middle">推論服務</text>
  <text x="460" y="326" fill="#8a96ab" font-size="12" text-anchor="middle">PyTorch / ONNX / TensorRT</text>

  <rect x="600" y="282" width="250" height="58" rx="8" fill="#10261f" stroke="#2f7d63" stroke-width="1.5"/>
  <text x="725" y="307" fill="#dbe4f0" font-size="14.5" font-weight="500" text-anchor="middle">測試管理</text>
  <text x="725" y="326" fill="#8a96ab" font-size="12" text-anchor="middle">batch × 精度 組合基準</text>

  <!-- Triton + model repo -->
  <rect x="190" y="388" width="380" height="60" rx="8" fill="#241a2e" stroke="#9a6fc0" stroke-width="1.5"/>
  <text x="380" y="414" fill="#dbe4f0" font-size="16" font-weight="500" text-anchor="middle">Triton Inference Server</text>
  <text x="380" y="434" fill="#a99bc4" font-size="12.5" text-anchor="middle">HTTP / gRPC / metrics</text>
  <rect x="600" y="390" width="250" height="56" rx="8" fill="#2a1e10" stroke="#9a7b3f" stroke-width="1.5"/>
  <text x="725" y="414" fill="#dbe4f0" font-size="15" font-weight="500" text-anchor="middle">模型庫</text>
  <text x="725" y="433" fill="#8a96ab" font-size="12" text-anchor="middle">model_repository</text>

  <!-- Monitoring -->
  <rect x="250" y="496" width="200" height="56" rx="8" fill="#2a1410" stroke="#c0603f" stroke-width="1.5"/>
  <text x="350" y="520" fill="#dbe4f0" font-size="15" font-weight="500" text-anchor="middle">Prometheus</text>
  <text x="350" y="539" fill="#c49a8a" font-size="12" text-anchor="middle">抓取 Triton / GPU 指標</text>
  <rect x="490" y="496" width="200" height="56" rx="8" fill="#2a1410" stroke="#c0603f" stroke-width="1.5"/>
  <text x="590" y="520" fill="#dbe4f0" font-size="15" font-weight="500" text-anchor="middle">Grafana</text>
  <text x="590" y="539" fill="#c49a8a" font-size="12" text-anchor="middle">VRAM · 利用率 · 吞吐</text>

  <!-- arrows -->
  <line x1="460" y1="154" x2="460" y2="188" stroke="#7c8aa5" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="380" y1="240" x2="240" y2="282" stroke="#7c8aa5" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="460" y1="240" x2="460" y2="282" stroke="#7c8aa5" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="540" y1="240" x2="680" y2="282" stroke="#7c8aa5" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="195" y1="340" x2="330" y2="388" stroke="#7c8aa5" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="460" y1="340" x2="420" y2="388" stroke="#7c8aa5" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="725" y1="340" x2="725" y2="390" stroke="#7c8aa5" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="600" y1="418" x2="570" y2="418" stroke="#7c8aa5" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="585" y="410" fill="#7c8aa5" font-size="11" text-anchor="middle">載入</text>
  <path d="M380 448 C 350 478, 350 478, 350 496" fill="none" stroke="#5d6b82" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="408" y="476" fill="#7c8aa5" font-size="11" text-anchor="middle">metrics</text>
  <line x1="450" y1="524" x2="490" y2="524" stroke="#7c8aa5" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
