version: '3.8'
services:
  backend-base:
    image: sys-backend-base
    build:
      context: ./backend
      dockerfile: Dockerfile.base

  triton:
    image: nvcr.io/nvidia/tritonserver:23.04-py3
    ports:
      - "8001:8000"  # HTTP API
      - "8002:8001"  # GRPC API  
      - "8003:8002"  # Metrics
    volumes:
      - ./model_repository:/models
    command: tritonserver --model-repository=/models --model-control-mode=explicit --allow-http=true --allow-grpc=true --allow-metrics=true --log-verbose=1 --strict-model-config=false --exit-on-error=false
    mem_limit: 16g
    shm_size: '8gb'
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./model_repository:/app/model_repository
    mem_limit: 16g
    shm_size: '8gb'
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
    environment:
      - MODEL_REPOSITORY_PATH=/app/model_repository
      - PYTHONUNBUFFERED=1
      - TRITON_URL=http://triton:8000
      # 允許的前端來源（逗號分隔），預設僅本機；正式部署請在 .env 覆寫
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      # 單一組態的效能量測重複次數上限（見 README「實驗方法」）
      - MAX_BENCHMARK_ITERATIONS=${MAX_BENCHMARK_ITERATIONS:-10}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level=debug
    depends_on:
      - backend-base
      - triton

  frontend-base:
    image: sys-frontend-base
    build:
      context: ./frontend
      dockerfile: Dockerfile.base

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite 只認 VITE_ 前綴且於建置期注入；同時以 environment 傳入供 dev server 使用。
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    mem_limit: 16g
    shm_size: '8gb'
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - frontend-base
      - backend 

  # 監控服務
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      # 密碼改為必填環境變數，未在 .env 設定時 compose 會直接報錯，避免預設弱密碼。
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?請在 .env 設定 GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    restart: unless-stopped
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

  nvidia-gpu-exporter:
    image: mindprince/nvidia_gpu_prometheus_exporter:0.1
    container_name: nvidia-gpu-exporter
    ports:
      - "9445:9445"
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  frontend_node_modules: 