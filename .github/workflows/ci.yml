name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-lint:
    name: backend (syntax + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 完整依賴需 GPU/CUDA/TensorRT 無法在 CI 安裝；以下為零依賴的靜態守門。
      - name: 語法檢查（compileall）
        run: python -m compileall -q app
      - name: Ruff（真實錯誤子集，見 ruff.toml）
        run: |
          pip install ruff==0.15.12
          ruff check app/

  frontend-build:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安裝相依
        run: npm ci
      # CI=false：CRA 預設把 ESLint warning 升為 error；既有 warning 尚未清，故先不阻擋。
      - name: Build
        env:
          CI: false
        run: npm run build
