name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-lint:
    name: backend (syntax + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 完整依賴需 GPU/CUDA/TensorRT 無法在 CI 安裝；以下為零依賴的靜態守門。
      - name: 語法檢查（compileall）
        run: python -m compileall -q app
      - name: Ruff（真實錯誤子集，見 ruff.toml）
        run: |
          pip install ruff==0.15.12
          ruff check app/

  backend-tests:
    name: backend (pytest — dependency-light)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 純邏輯單元測試只依賴 pydantic（不需 torch/tensorrt/GPU），故獨立輕量安裝。
      - name: 安裝測試相依
        run: pip install pytest pydantic==2.4.2
      - name: pytest（純邏輯 characterization 測試）
        run: python -m pytest tests/ -q

  frontend-build:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安裝相依
        run: npm ci
      - name: 單元測試（Vitest）
        run: npm test
      - name: Build
        run: npm run build
