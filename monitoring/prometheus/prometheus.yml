global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # 系統資源監控 (使用 node_exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 10s
    metrics_path: /metrics

  # NVIDIA GPU 監控 (使用 nvidia_gpu_exporter)  
  - job_name: 'nvidia-gpu-exporter'
    static_configs:
      - targets: ['nvidia-gpu-exporter:9445']
    scrape_interval: 10s
    metrics_path: /metrics

  # Triton Inference Server 監控
  - job_name: 'triton'
    static_configs:
      - targets: ['triton:8002']
    scrape_interval: 15s
    metrics_path: /metrics

  # Prometheus 自身監控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090'] 